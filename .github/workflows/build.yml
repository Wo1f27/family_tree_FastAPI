name: Build Family Tree

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install pyinstaller
      
      - name: Build desktop executable
        shell: bash
        run: |
          pyinstaller --clean \
            --name "family_tree" \
            --add-data "data;data" \
            --hidden-import "gui" \
            --hidden-import "models" \
            --hidden-import "database" \
            --hidden-import "dates" \
            main.py
      
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: dist/family_tree.exe

  build-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install fastapi uvicorn sqlalchemy pydantic pydantic-settings jinja2 python-multipart
      
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      
      - name: Build web executable
        shell: bash
        run: |
          pyinstaller --clean \
            --name "family_tree_web" \
            --add-data "src/familytree/templates:familytree/templates" \
            --add-data "src/familytree/static:familytree/static" \
            --hidden-import "familytree.main" \
            --hidden-import "familytree.core.database" \
            --hidden-import "familytree.core.config" \
            --hidden-import "familytree.core.templates" \
            --hidden-import "familytree.infrastructure.db.models" \
            --hidden-import "familytree.infrastructure.db.repositories.person_repo" \
            --hidden-import "familytree.api.v1.endpoints.pages" \
            --hidden-import "familytree.api.v1.endpoints.persons" \
            --hidden-import "familytree.schemas.person" \
            src/familytree/main.py
      
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-exe
          path: dist/family_tree_web.exe

  create-installer:
    needs: [build-desktop, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: artifacts/desktop
      
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-exe
          path: artifacts/web
      
      - name: Create installer package
        shell: bash
        run: |
          # Create installer directory structure
          mkdir installer-package
          cp artifacts/desktop/family_tree.exe installer-package/
          cp artifacts/web/family_tree_web.exe installer-package/
          cp -r data installer-package/
          
          # Create README
          echo "# Family Tree Setup" > installer-package/README.txt
          echo "" >> installer-package/README.txt
          echo "Installation Instructions:" >> installer-package/README.txt
          echo "1. Copy all files from this folder to your desired location" >> installer-package/README.txt
          echo "2. Run family_tree.exe for desktop application" >> installer-package/README.txt
          echo "3. Run family_tree_web.exe for web interface (starts on http://localhost:8000)" >> installer-package/README.txt
      
      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-package
          path: installer-package/
          retention-days: 14
