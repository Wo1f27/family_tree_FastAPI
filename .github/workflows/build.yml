name: Build Family Tree

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: |
          (Invoke-WebRequest -Uri https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -UseBasicParsing).Content | Out-File uv.zip
          Expand-Archive -Path uv.zip -DestinationPath $env:USERPROFILE\.local\bin -Force
          $env:Path += ";$env:USERPROFILE\.local\bin"
        shell: pwsh
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install pyinstaller
      
      - name: Build desktop executable
        run: |
          uv run pyinstaller --clean \
            --name "family_tree" \
            --add-data "data;data" \
            --hidden-import "gui" \
            --hidden-import "models" \
            --hidden-import "database" \
            --hidden-import "dates" \
            main.py
      
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: dist/family_tree.exe

  build-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: |
          (Invoke-WebRequest -Uri https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -UseBasicParsing).Content | Out-File uv.zip
          Expand-Archive -Path uv.zip -DestinationPath $env:USERPROFILE\.local\bin -Force
          $env:Path += ";$env:USERPROFILE\.local\bin"
        shell: pwsh
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: uv pip install fastapi uvicorn sqlalchemy pydantic pydantic-settings jinja2 python-multipart pyinstaller
      
      - name: Build web executable
        run: |
          uv run pyinstaller --clean \
            --name "family_tree_web" \
            --add-data "src/familytree/templates;familytree/templates" \
            --add-data "src/familytree/static;familytree/static" \
            --hidden-import "familytree.main" \
            --hidden-import "familytree.core.database" \
            --hidden-import "familytree.core.config" \
            --hidden-import "familytree.core.templates" \
            --hidden-import "familytree.infrastructure.db.models" \
            --hidden-import "familytree.infrastructure.db.repositories.person_repo" \
            --hidden-import "familytree.api.v1.endpoints.pages" \
            --hidden-import "familytree.api.v1.endpoints.persons" \
            --hidden-import "familytree.schemas.person" \
            src/familytree/main.py
      
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-exe
          path: dist/family_tree_web.exe

  create-installer:
    needs: [build-desktop, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: artifacts/desktop
      
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-exe
          path: artifacts/web
      
      - name: Create installer package
        run: |
          # Create installer directory structure
          New-Item -ItemType Directory -Path installer-package -Force
          Copy-Item artifacts/desktop/family_tree.exe installer-package/
          Copy-Item artifacts/web/family_tree_web.exe installer-package/
          Copy-Item -Recurse -Path data -Destination installer-package/
          
          # Create README
          $readme = @"
# Family Tree Setup

Installation Instructions:
1. Copy all files from this folder to your desired location
2. Run family_tree.exe for desktop application
3. Run family_tree_web.exe for web interface (starts on http://localhost:8000)
"@
          Set-Content -Path installer-package/README.txt -Value $readme
      
      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-package
          path: installer-package/
          retention-days: 14
