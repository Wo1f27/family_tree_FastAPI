# Windows build on GitHub (develop on Ubuntu).
# Repo → Actions → "Build Windows" → Run workflow → download artifacts.

name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Full requirements.txt pulls uvloop (no Windows wheels) and other API-only deps.
      # The Tkinter app only needs SQLAlchemy at runtime.
      - name: Install bundle dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.0" "SQLAlchemy>=2.0"

      - name: PyInstaller (onedir)
        run: pyinstaller --name FamilyTree --windowed --onedir --noconfirm main.py

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTree-Windows-portable
          path: dist/FamilyTree/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after Inno Setup install. Checked: $($candidates -join ', ')"
          }
          & $iscc "${{ github.workspace }}\installer\family_tree.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTreeSetup
          path: dist_installer/FamilyTreeSetup.exe
