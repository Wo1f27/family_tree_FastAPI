# ===========================================
# Family Tree - Docker Compose
# ===========================================
# Для локальной разработки и продакшена
# PostgreSQL устанавливается нативно на сервер

version: '3.8'

services:
  # Nginx — reverse proxy + SSL
  nginx:
    image: nginx:alpine
    container_name: familytree-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - familytree

  # FastAPI приложение
  app:
    build: .
    container_name: familytree-app
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      - FAMILY_TREE_DB_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    command: >
      bash -c "
        alembic upgrade head &&
        exec gunicorn familytree.main:app \\
          -w 4 \\
          -k uvicorn.workers.UvicornWorker \\
          --bind 0.0.0.0:8000 \\
          --access-logfile - \\
          --error-logfile -
      "

    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - familytree

volumes:
  uploads_data:
    driver: local

networks:
  familytree:
    driver: bridge
